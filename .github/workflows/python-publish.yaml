name: Build and publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygensuggestions/${{github.event.release.name}}
    steps:
      - run: | # zizmor: ignore[template-injection]
          RELNAME="${{github.event.release.name}}"
          if [[ ! $RELNAME =~ ^[0-9]+\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]; then
            echo "Release name '$RELNAME' does not match the expected format 'X.Y.Z' where Y and Z are between 0 and 255"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - run: uv build
      - run: uv publish
