name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: false
    - run: uvx ruff check --output-format github
    - run: uvx ty check --output-format github
    - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
      with:
        globs: |
          .github/**/*.md
          *.md
    - run: uv audit --preview-feature audit-command
    - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
    - uses: jonathandung/check-empty@6b24e2c247289fc39c89708eb1963d7dc10fdd85
      with:
        filenames: pygensuggestions/py.typed
    - run: COVERAGE_RCFILE=.coveragerc uv run --group test --python 3.15 -m pytest -vv --cov-report xml
    - run: uv run --group test --python 3.8 -m pytest -vv --no-cov
    - run: uv run --group test --python pp38 -m pytest -vv --no-cov
    - run: uv run --group test --python gp311 -m pytest -vv --no-cov
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        flags: unittests
        name: codecov-umbrella
        token: ${{secrets.CODECOV_TOKEN}}
        verbose: true
    timeout-minutes: 3
