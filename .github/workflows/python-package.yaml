name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: false
    - run: uvx ruff check --output-format github
    - run: uvx ty check --output-format github
    - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34
      with:
        globs: |
          .github/**/*.md
          *.md
    - run: uv audit --preview-feature audit-command
    - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
    - uses: jonathandung/check-empty@83f176d1255ed31da4bccdcb7a6d834b192914b8
      with:
        filenames: pygensuggestions/py.typed
    - run: COVERAGE_RCFILE=.coveragerc uv run --group test --python 3.15 -m pytest -vv --cov-report xml
    - run: uv run --group test --python 3.8 -m pytest -vv --no-cov
    - run: uv run --group test --python pp38 -m pytest -vv --no-cov
    - run: uv run --group test --python gp311 -m pytest -vv --no-cov
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        flags: unittests
        name: codecov-umbrella
        token: ${{secrets.CODECOV_TOKEN}}
        verbose: true
    timeout-minutes: 3
