[build-system]
requires = ["uv_build>=0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest==8.3.5", "pytest-cov==5.0.0", "pytest-sugar==1.1.1"]

[project]
name = "pygensuggestions"
version = "2.3.2"
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
description = "Generate suggestions deterministically based on mistyped input and possible targets."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Operating System :: OS Independent", "Development Status :: 5 - Production/Stable", "Framework :: Pytest", "Intended Audience :: Developers", "Intended Audience :: Education", "Intended Audience :: End Users/Desktop", "Topic :: Education", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Text Processing :: Filters", "Topic :: Utilities", "Natural Language :: English", "Environment :: Console", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/jonathandung/pygensuggestions"
Repository = "https://github.com/jonathandung/pygensuggestions.git"
Issues = "https://github.com/jonathandung/pygensuggestions/issues"
Download = "https://pypi.org/project/pygensuggestions/#files"
"Release Notes" = "https://github.com/jonathandung/pygensuggestions/releases/tag/2.3.2"

[project.scripts]
pygensuggestions = "pygensuggestions.__main__:main"

[tool.setuptools]
packages = ["pygensuggestions"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_pygensuggestions.py"
python_functions = "test_*"
addopts = ["-v", "--maxfail", "0", "--tb", "short", "--cov", "pygensuggestions", "--cov-report", "term-missing", "--cov-fail-under", "100"]
minversion = "8.0.0"
required_plugins = ["pytest-cov==5.0.0", "pytest-sugar==1.1.1"]

[tool.ruff]
target-version = "py38"
required-version = ">=0.17.0"

[tool.ruff.analyze]
type-checking-imports = false

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["blank-lines-after-function-or-class", "blank-lines-top-level", "docstring-missing-exception", "docstring-missing-returns", "implicit-return-value", "incorrect-blank-line-before-class", "line-too-long", "missing-blank-line-after-summary", "missing-copyright-notice", "missing-newline-at-end-of-file", "missing-trailing-comma", "missing-whitespace-around-arithmetic-operator", "missing-whitespace-around-bitwise-or-shift-operator", "multi-line-summary-second-line", "print", "too-few-spaces-before-inline-comment", "undocumented-public-function"]
select = ["ALL"]
preview = true
typing-extensions = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["ANN", "meta-class-abc-meta", "PYI"]
"**/*.pyi" = ["docstring-in-stub", "bad-exit-annotation", "snake-case-type-alias"]
"pygensuggestions/__init__.py" = ["non-empty-init-module"]
"pygensuggestions/lib.py" = ["unused-loop-control-variable"]
"test_pygensuggestions.py" = ["assert"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.8"
python-platform = "all"

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ty.src]
include = ["pygensuggestions"]

[tool.uv]
preview-features = ["audit-command"]
required-version = ">=0.13.0"

[tool.uv.audit]
ignore = ["GHSA-6w46-j5rx-g56g"]

[tool.uv.build-backend]
module-name = "pygensuggestions"
module-root = ""
